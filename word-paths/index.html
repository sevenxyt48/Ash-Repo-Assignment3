<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f3ee">
    <meta name="description" content="Explore connections between words in Chinese, English, Japanese, and Korean.">
    <title>Word Paths — 词语之间</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Word Paths 首页">
        <span class="brand-mark" aria-hidden="true">W</span>
        <span>WORD PATHS<span class="brand-subtitle">词语之间</span></span>
      </a>
      <p class="topbar-note">一张关于词语、意义与联想的地图</p>
    </header>

    <main class="page-shell">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">A SMALL MAP OF MEANING</p>
        <h1 id="page-title">从一个词，走向另一个词。</h1>
        <p class="intro-copy">探索中文、English、日本語与한국어中的词语，以及它们之间的意义路径。</p>
      </section>

      <section class="workspace" aria-label="词语关系探索器">
        <div class="explorer">
          <div class="toolbar">
            <label class="search-box">
              <span class="sr-only">搜索词语</span>
              <span class="search-icon" aria-hidden="true">⌕</span>
              <input id="search" type="search" placeholder="搜索词语或释义…" autocomplete="off">
              <kbd>/</kbd>
            </label>
            <label class="select-box">
              <span class="sr-only">图谱显示语言</span>
              <select id="language">
                <option value="zh">中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
              </select>
            </label>
            <label class="select-box">
              <span class="sr-only">筛选主题</span>
              <select id="category">
                <option value="all">所有主题</option>
              </select>
            </label>
            <button class="random-button" id="random" type="button">
              <span aria-hidden="true">↝</span> 随机漫游
            </button>
          </div>

          <div class="graph-heading">
            <div>
              <h2>词语地图</h2>
              <p id="result-count" aria-live="polite">正在载入词语…</p>
            </div>
            <div class="graph-hint"><span class="hint-dot"></span> 选择一个节点查看详情</div>
          </div>
          <div class="graph-frame">
            <div id="graph" class="graph" role="region" aria-label="可交互的词语关系图"></div>
            <div id="graph-message" class="graph-message" role="status" hidden></div>
          </div>
          <div class="legend" aria-label="连线含义">
            <span><i class="legend-line legend-related"></i>语义相关</span>
            <span><i class="legend-line legend-imagery"></i>意象联想</span>
            <span><i class="legend-line legend-contrast"></i>对照关系</span>
          </div>
        </div>

        <aside class="details-panel" id="details" aria-live="polite" aria-label="词语详情">
          <div class="empty-detail">
            <span class="detail-sparkle" aria-hidden="true">✳</span>
            <p class="eyebrow">YOUR NEXT WORD</p>
            <h2>从地图开始</h2>
            <p>选择一个节点，发现它的读音、释义与相连的词语。</p>
            <div class="empty-path" aria-hidden="true"><span></span><i></i><span></span></div>
          </div>
        </aside>
      </section>
      <footer class="page-footer">
        <span>Words are paths, not islands.</span>
        <span>中文 · English · 日本語 · 한국어</span>
      </footer>
    </main>
  </body>
</html>
